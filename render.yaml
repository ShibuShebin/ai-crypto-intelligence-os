services:
  - type: web
    name: ai-crypto-intelligence-os
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn agent.api:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: LLM_PROVIDER
        value: groq
      - key: GROQ_API_KEY
        sync: false
